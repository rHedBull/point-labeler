<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GT Annotation Tool — Industrial Point Cloud</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; color: #e0e0e0; font-family: 'SF Mono', 'Fira Code', monospace; overflow: hidden; }
canvas { display: block; }

#toolbar {
    position: fixed; top: 0; left: 260px; right: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    background: rgba(15,15,35,0.95);
    border-bottom: 1px solid #2a2a4a;
    z-index: 100;
}
.btn {
    padding: 5px 12px; border: 1px solid #3a3a6a; border-radius: 4px;
    background: #1a1a3a; color: #c0c0e0; cursor: pointer; font-size: 12px;
    font-family: inherit; transition: all 0.15s; white-space: nowrap;
}
.btn:hover { background: #2a2a5a; border-color: #5a5a9a; }
.btn.active { background: #3a3a7a; border-color: #7a7aff; color: #fff; }
.btn.danger { border-color: #6a2a2a; }
.btn.danger:hover { background: #4a1a1a; border-color: #ff4a4a; }
.btn.export { border-color: #2a6a2a; }
.btn.export:hover { background: #1a4a1a; border-color: #4aff4a; }

#sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 260px;
    background: rgba(15,15,35,0.95); border-right: 1px solid #2a2a4a;
    display: flex; flex-direction: column; z-index: 100;
}
#sidebar-header {
    padding: 10px 12px; border-bottom: 1px solid #2a2a4a;
    font-size: 13px; font-weight: bold; color: #7dd3fc;
}
#segment-list {
    flex: 1; overflow-y: auto; font-size: 11px;
}
#segment-list .item {
    padding: 5px 10px; cursor: pointer; border-bottom: 1px solid #1a1a3a;
    display: flex; align-items: center; gap: 6px;
    transition: background 0.1s;
}
#segment-list .item:hover { background: #1a1a4a; }
#segment-list .item.active { background: #2a2a6a; border-left: 3px solid #7a7aff; }
#segment-list .item .eye { cursor: pointer; opacity: 0.5; font-size: 13px; flex-shrink: 0; }
#segment-list .item .eye.hidden { opacity: 0.2; }
#segment-list .item .seg-info { flex: 1; overflow: hidden; text-overflow: ellipsis; }
#segment-list .item .seg-type {
    display: inline-block; font-size: 9px; padding: 1px 4px; border-radius: 3px;
    text-transform: uppercase; font-weight: bold; margin-right: 4px;
}
.type-cylinder { background: #1a3a2a; color: #4ade80; }
.type-plane { background: #3a3a1a; color: #facc15; }
.type-sphere { background: #1a2a4a; color: #60a5fa; }
.type-unknown { background: #2a1a3a; color: #a78bfa; }
#segment-list .item .seg-pts { color: #666; font-size: 10px; flex-shrink: 0; }
#segment-list .item .unmerge-btn {
    font-size: 10px; cursor: pointer; color: #f87171; opacity: 0.5;
    flex-shrink: 0; padding: 2px 4px;
}
#segment-list .item .unmerge-btn:hover { opacity: 1; }
.class-badge {
    display: inline-block; font-size: 9px; padding: 1px 4px; border-radius: 3px;
    font-weight: bold; margin-right: 4px;
}
.class-pipe { background: #1a3a2a; color: #4ade80; }
.class-tank { background: #3a1a1a; color: #f87171; }
.class-equipment { background: #1a2a4a; color: #60a5fa; }
.class-structural { background: #3a3a1a; color: #facc15; }
.class-double { background: #3a1a3a; color: #e879f9; }

#selection-panel {
    position: fixed; bottom: 0; left: 260px; right: 0;
    background: rgba(15,15,35,0.95); border-top: 1px solid #2a2a4a;
    padding: 10px 16px; z-index: 100; display: none;
    font-size: 12px;
}
#selection-panel .pills { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
#selection-panel .pill {
    background: #2a2a4a; padding: 2px 8px; border-radius: 10px; font-size: 11px;
    color: #facc15;
}
#selection-panel .stats { color: #888; }

#label-picker {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(15,15,35,0.98); border: 2px solid #3a3a7a; border-radius: 12px;
    padding: 20px; z-index: 300; display: none; text-align: center;
}
#label-picker .title { font-size: 15px; color: #7dd3fc; margin-bottom: 14px; }
#label-picker .options { display: flex; gap: 10px; justify-content: center; }
#label-picker .opt {
    padding: 10px 20px; border-radius: 8px; cursor: pointer;
    font-size: 14px; font-weight: bold; font-family: inherit;
    border: 2px solid transparent; transition: all 0.15s;
}
#label-picker .opt:hover { transform: scale(1.05); }
.opt-pipe { background: #1a3a2a; color: #4ade80; border-color: #4ade80 !important; }
.opt-tank { background: #3a1a1a; color: #f87171; border-color: #f87171 !important; }
.opt-equipment { background: #1a2a4a; color: #60a5fa; border-color: #60a5fa !important; }
.opt-structural { background: #3a3a1a; color: #facc15; border-color: #facc15 !important; }
.opt-double { background: #3a1a3a; color: #e879f9; border-color: #e879f9 !important; }

#save-indicator {
    font-size: 11px; color: #666; margin-left: auto;
}

#loading {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10,10,26,0.95); z-index: 500;
    transition: opacity 0.5s;
}
#loading.hidden { opacity: 0; pointer-events: none; }
.spinner {
    width: 48px; height: 48px; border: 4px solid #2a2a4a;
    border-top-color: #7a7aff; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading .text { color: #7dd3fc; font-size: 15px; }

#help-bar {
    position: fixed; bottom: 0; right: 12px;
    font-size: 10px; color: #444; z-index: 50; padding: 4px;
}
#help-bar kbd {
    background: #2a2a4a; padding: 1px 4px; border-radius: 2px;
    color: #666; border: 1px solid #3a3a5a;
}
</style>
</head>
<body>

<div id="loading">
    <div class="spinner"></div>
    <div class="text">Loading segments...</div>
</div>

<div id="sidebar">
    <div id="sidebar-header">GT Annotation</div>
    <div style="padding:6px 10px; border-bottom:1px solid #2a2a4a; display:flex; gap:6px;">
        <button class="btn active" id="btn-unconfirmed" onclick="setMode('unconfirmed')">Unconfirmed</button>
        <button class="btn" id="btn-confirmed" onclick="setMode('confirmed')">Confirmed</button>
        <button class="btn" id="btn-all" onclick="setMode('all')">All</button>
    </div>
    <div id="filter-bar" style="padding:4px 10px; border-bottom:1px solid #2a2a4a; display:flex; gap:4px; flex-wrap:wrap; align-items:center;">
        <span style="font-size:10px; color:#666;">Filter:</span>
        <button class="btn active" style="padding:2px 6px; font-size:10px;" id="flt-all" onclick="setLabelFilter('all')">All</button>
        <button class="btn" style="padding:2px 6px; font-size:10px;" id="flt-pipe" onclick="setLabelFilter('pipe')"><span class="class-badge class-pipe" style="margin:0;">pipe</span></button>
        <button class="btn" style="padding:2px 6px; font-size:10px;" id="flt-tank" onclick="setLabelFilter('tank')"><span class="class-badge class-tank" style="margin:0;">tank</span></button>
        <button class="btn" style="padding:2px 6px; font-size:10px;" id="flt-equipment" onclick="setLabelFilter('equipment')"><span class="class-badge class-equipment" style="margin:0;">equip</span></button>
        <button class="btn" style="padding:2px 6px; font-size:10px;" id="flt-structural" onclick="setLabelFilter('structural')"><span class="class-badge class-structural" style="margin:0;">struct</span></button>
        <button class="btn" style="padding:2px 6px; font-size:10px;" id="flt-double" onclick="setLabelFilter('double')"><span class="class-badge class-double" style="margin:0;">double</span></button>
    </div>
    <div id="visibility-bar" style="padding:4px 10px; border-bottom:1px solid #2a2a4a; display:flex; gap:4px; align-items:center;">
        <button class="btn" style="padding:2px 8px; font-size:10px;" onclick="showAllSegments()">Show All</button>
        <button class="btn" style="padding:2px 8px; font-size:10px;" onclick="hideAllSegments()">Hide All</button>
        <button class="btn" style="padding:2px 8px; font-size:10px;" onclick="showOnlyFiltered()">Show Only Filtered</button>
        <span id="visibility-count" style="font-size:10px; color:#666; margin-left:auto;"></span>
    </div>
    <div id="segment-list"></div>
</div>

<div id="toolbar">
    <button class="btn" id="btn-prev" onclick="stepNav(-1)">&#9664;</button>
    <button class="btn" id="btn-next" onclick="stepNav(1)">&#9654;</button>
    <span id="nav-counter" style="font-size:12px; color:#888; min-width:60px;">0/0</span>
    <span style="flex:1"></span>
    <label style="font-size:11px; color:#888; cursor:pointer;">
        <input type="checkbox" id="chk-autohide" onchange="toggleAutoHide()"> Auto-hide confirmed
    </label>
    <label style="font-size:11px; color:#888; cursor:pointer;">
        <input type="checkbox" id="chk-context" checked onchange="toggleContext()"> Context
    </label>
    <label id="lbl-mesh" style="font-size:11px; color:#888; cursor:pointer; display:none;">
        <input type="checkbox" id="chk-mesh" onchange="toggleMesh()"> Mesh
    </label>
    <button class="btn" id="btn-save" onclick="saveSession()">Save</button>
    <button class="btn export" id="btn-export" onclick="doExport()">Export</button>
    <span id="save-indicator"></span>
</div>

<div id="selection-panel">
    <div class="pills" id="sel-pills"></div>
    <div class="stats" id="sel-stats"></div>
    <div style="margin-top:4px; font-size:11px; color:#666;">
        <kbd>Ctrl+Click</kbd> to select/deselect &nbsp; <kbd>Ctrl+Enter</kbd> to confirm &nbsp; <kbd>Esc</kbd> to clear
    </div>
</div>

<div id="label-picker">
    <div class="title">Assign class label</div>
    <div class="options">
        <div class="opt opt-pipe" onclick="confirmLabel('pipe')">Pipe</div>
        <div class="opt opt-tank" onclick="confirmLabel('tank')">Tank</div>
        <div class="opt opt-equipment" onclick="confirmLabel('equipment')">Equipment</div>
        <div class="opt opt-structural" onclick="confirmLabel('structural')">Structural</div>
        <div class="opt opt-double" onclick="confirmLabel('double')">Double</div>
    </div>
    <div style="margin-top:10px; font-size:11px; color:#666;">Press 1-4 or Esc to cancel</div>
</div>

<div id="help-bar">
    <kbd>&#8592;&#8594;</kbd> navigate &nbsp;
    <kbd>Ctrl+Click</kbd> select &nbsp;
    <kbd>Ctrl+Enter</kbd> confirm &nbsp;
    <kbd>Esc</kbd> clear &nbsp;
    <kbd>Ctrl+S</kbd> save
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>

// ── Constants ──
const CLASS_COLORS = {
    pipe: [0.29, 0.87, 0.50],
    tank: [0.97, 0.44, 0.44],
    equipment: [0.38, 0.65, 0.98],
    structural: [0.98, 0.80, 0.08],
    double: [0.91, 0.47, 0.98],
};
const GOLDEN_RATIO = 0.618033988;

// ── State ──
let allSegments = [];         // from server
let contextData = null;
let sceneCenter = [0,0,0], sceneExtent = 1;
let session = { confirmed: [], hidden_segments: [], mode: 'unconfirmed', next_gt_id: 0 };

let mode = 'unconfirmed';     // 'unconfirmed', 'confirmed', or 'all'
let labelFilter = 'all';     // 'all', 'pipe', 'tank', 'equipment', 'structural', 'double'
let navIndex = -1;            // current navigation position in displayed list
let mergeSelection = new Set(); // segment IDs currently selected for merge
let showCtx = true;
let autoHideConfirmed = false;

// Maps: segment_id → Three.js Points object
let segmentClouds = {};
let segmentOrigColors = {};   // segment_id → Float32Array of original colors
let contextCloud = null;
let bboxHelper = null;

// Debounce save
let saveTimer = null;

// ── Three.js Setup ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);
const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 1000);

// Container div captures all mouse events for both renderers
const container = document.createElement('div');
container.id = 'viewport-container';
container.style.position = 'fixed';
container.style.overflow = 'hidden';
document.body.appendChild(container);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.domElement.style.position = 'absolute';
renderer.domElement.style.pointerEvents = 'none';
container.appendChild(renderer.domElement);

// Mesh renderer + scene (created lazily)
let meshRenderer = null;
let meshScene = null;
let meshObject = null;  // cached loaded mesh
let showMesh = false;
let hasMesh = false;

const controls = new THREE.OrbitControls(camera, container);
controls.enableDamping = true;
controls.dampingFactor = 0.1;

function resizeRenderer() {
    const left = 260;
    const top = 42;
    const fullW = window.innerWidth - left;
    const h = window.innerHeight - top;
    const pcW = showMesh ? Math.floor(fullW / 2) : fullW;

    renderer.setSize(pcW, h);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.domElement.style.left = '0px';
    renderer.domElement.style.top = '0px';
    camera.aspect = pcW / h;
    camera.updateProjectionMatrix();

    if (meshRenderer && showMesh) {
        const meshW = fullW - pcW;
        meshRenderer.setSize(meshW, h);
        meshRenderer.setPixelRatio(window.devicePixelRatio);
        meshRenderer.domElement.style.left = pcW + 'px';
        meshRenderer.domElement.style.top = '0px';
        meshRenderer.domElement.style.display = '';
    }
    if (meshRenderer && !showMesh) {
        meshRenderer.domElement.style.display = 'none';
    }

    container.style.left = left + 'px';
    container.style.top = top + 'px';
    container.style.width = fullW + 'px';
    container.style.height = h + 'px';
}
window.addEventListener('resize', resizeRenderer);

// ── Camera Animation ──
let animating = false, animStart = 0, animDuration = 600;
let camFrom = {}, camTo = {};

function animateCamera(pos, look) {
    camFrom = {
        px: camera.position.x, py: camera.position.y, pz: camera.position.z,
        tx: controls.target.x, ty: controls.target.y, tz: controls.target.z,
    };
    camTo = { px: pos.x, py: pos.y, pz: pos.z, tx: look.x, ty: look.y, tz: look.z };
    animStart = performance.now();
    animating = true;
}

function easeInOutCubic(t) {
    return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
}

function updateCameraAnim() {
    if (!animating) return;
    let t = Math.min((performance.now() - animStart) / animDuration, 1);
    t = easeInOutCubic(t);
    camera.position.set(
        camFrom.px + (camTo.px - camFrom.px) * t,
        camFrom.py + (camTo.py - camFrom.py) * t,
        camFrom.pz + (camTo.pz - camFrom.pz) * t
    );
    controls.target.set(
        camFrom.tx + (camTo.tx - camFrom.tx) * t,
        camFrom.ty + (camTo.ty - camFrom.ty) * t,
        camFrom.tz + (camTo.tz - camFrom.tz) * t
    );
    if (t >= 1) animating = false;
}

function focusSegment(seg) {
    const c = new THREE.Vector3(seg.center[0], seg.center[1], seg.center[2]);
    const d = Math.max(seg.extent * 2.5, 0.5);
    animateCamera(new THREE.Vector3(c.x + d*0.5, c.y + d*0.4, c.z + d*0.5), c);
}

function focusScene() {
    const c = new THREE.Vector3(sceneCenter[0], sceneCenter[1], sceneCenter[2]);
    const d = sceneExtent * 0.9;
    animateCamera(new THREE.Vector3(c.x + d*0.6, c.y + d*0.4, c.z + d*0.6), c);
}

// ── Point Cloud Creation ──
function hueToRgb(hue) {
    const h = hue * 6;
    const x = 1.0 - Math.abs(h % 2 - 1);
    if (h < 1) return [1, x, 0];
    if (h < 2) return [x, 1, 0];
    if (h < 3) return [0, 1, x];
    if (h < 4) return [0, x, 1];
    if (h < 5) return [x, 0, 1];
    return [1, 0, x];
}

function makePointCloud(seg, colorMode) {
    const n = seg.x.length;
    const geom = new THREE.BufferGeometry();
    const pos = new Float32Array(n * 3);
    const col = new Float32Array(n * 3);

    let rgb;
    if (colorMode === 'class') {
        rgb = CLASS_COLORS[seg._classLabel] || [0.6, 0.6, 0.6];
    } else {
        // Golden ratio hue
        rgb = hueToRgb((seg.id * GOLDEN_RATIO) % 1.0);
    }

    for (let i = 0; i < n; i++) {
        pos[i*3] = seg.x[i]; pos[i*3+1] = seg.y[i]; pos[i*3+2] = seg.z[i];
        if (colorMode === 'original') {
            col[i*3] = seg.r[i]/255; col[i*3+1] = seg.g[i]/255; col[i*3+2] = seg.b[i]/255;
        } else {
            col[i*3] = rgb[0]; col[i*3+1] = rgb[1]; col[i*3+2] = rgb[2];
        }
    }
    geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geom.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const mat = new THREE.PointsMaterial({
        size: 0.025, vertexColors: true, transparent: true, opacity: 1.0,
        sizeAttenuation: true,
    });
    const pts = new THREE.Points(geom, mat);
    pts.userData.segId = seg.id;
    return pts;
}

function buildContextCloud() {
    if (!contextData) return;
    const n = contextData.x.length;
    const geom = new THREE.BufferGeometry();
    const pos = new Float32Array(n * 3);
    const col = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
        pos[i*3] = contextData.x[i]; pos[i*3+1] = contextData.y[i]; pos[i*3+2] = contextData.z[i];
        col[i*3] = contextData.r[i]/255; col[i*3+1] = contextData.g[i]/255; col[i*3+2] = contextData.b[i]/255;
    }
    geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geom.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const mat = new THREE.PointsMaterial({
        size: 0.015, vertexColors: true, transparent: true, opacity: 0.3,
        sizeAttenuation: true,
    });
    contextCloud = new THREE.Points(geom, mat);
    scene.add(contextCloud);
}

// ── Bounding Box ──
function removeBBox() {
    if (bboxHelper) { scene.remove(bboxHelper); bboxHelper = null; }
}

function addBBox(seg) {
    removeBBox();
    const pad = 0.02;
    const box = new THREE.Box3(
        new THREE.Vector3(seg.bbox_min[0]-pad, seg.bbox_min[1]-pad, seg.bbox_min[2]-pad),
        new THREE.Vector3(seg.bbox_max[0]+pad, seg.bbox_max[1]+pad, seg.bbox_max[2]+pad)
    );
    bboxHelper = new THREE.Box3Helper(box, 0x7a7aff);
    scene.add(bboxHelper);
}

// ── Segment Management ──
function getConfirmedSourceIds() {
    const ids = new Set();
    for (const gt of session.confirmed) {
        for (const sid of gt.source_segment_ids) ids.add(sid);
    }
    return ids;
}

function getUnconfirmedSegments() {
    const confirmed = getConfirmedSourceIds();
    return allSegments.filter(s => !confirmed.has(s.id));
}

function getSegmentLabel(segId) {
    // Returns the confirmed label for a source segment, or falls back to summary class_label
    for (const gt of session.confirmed) {
        if (gt.source_segment_ids.indexOf(segId) >= 0) return gt.label;
    }
    // Fall back to class_label from summary/segment data
    var seg = allSegments.find(function(s) { return s.id === segId; });
    if (seg && seg.class_label) return seg.class_label;
    return null;
}

function applyLabelFilter(list, isSourceSegments) {
    if (labelFilter === 'all') return list;
    if (isSourceSegments) {
        return list.filter(function(seg) {
            const lbl = getSegmentLabel(seg.id);
            if (lbl) return lbl === labelFilter;
            // Unconfirmed segments — no class label, still show them in unconfirmed mode
            return mode === 'unconfirmed';
        });
    } else {
        // Confirmed GT segments
        return list.filter(function(gt) { return gt.label === labelFilter; });
    }
}

function getDisplayList() {
    if (mode === 'unconfirmed') return applyLabelFilter(getUnconfirmedSegments(), true);
    if (mode === 'confirmed') return applyLabelFilter(session.confirmed, false);
    // 'all' mode: return all source segments
    return applyLabelFilter(allSegments, true);
}

function isHidden(segId) {
    return session.hidden_segments.indexOf(segId) >= 0;
}

// ── Build Scene ──
function buildScene() {
    // Remove old clouds
    for (const id of Object.keys(segmentClouds)) {
        scene.remove(segmentClouds[id]);
    }
    segmentClouds = {};
    segmentOrigColors = {};

    const confirmedSrcIds = getConfirmedSourceIds();

    // Build a lookup: source_id → gt_seg for confirmed segments
    const srcToGt = {};
    for (const gt of session.confirmed) {
        for (const sid of gt.source_segment_ids) {
            srcToGt[sid] = gt;
        }
    }

    for (const seg of allSegments) {
        const gt = srcToGt[seg.id];
        let cloud;
        if (gt) {
            // Part of a confirmed GT segment — use class color
            seg._classLabel = gt.label;
            cloud = makePointCloud(seg, 'class');
        } else {
            // Unconfirmed — golden ratio color
            cloud = makePointCloud(seg, 'golden');
        }
        scene.add(cloud);
        segmentClouds[seg.id] = cloud;
        // Store original colors for restore
        segmentOrigColors[seg.id] = cloud.geometry.attributes.color.array.slice();

        // Apply hidden state
        if (isHidden(seg.id)) cloud.visible = false;
    }

    // Context
    if (contextCloud) contextCloud.visible = showCtx;
}

// ── Visual Updates ──
function updateSegmentVisuals() {
    const confirmedSrcIds = getConfirmedSourceIds();
    const srcToGt = {};
    for (const gt of session.confirmed) {
        for (const sid of gt.source_segment_ids) srcToGt[sid] = gt;
    }

    for (const seg of allSegments) {
        const cloud = segmentClouds[seg.id];
        if (!cloud) continue;

        if (isHidden(seg.id)) { cloud.visible = false; continue; }

        const gt = srcToGt[seg.id];
        const isSelected = mergeSelection.has(seg.id);

        if (isSelected) {
            // Bright yellow highlight
            const arr = cloud.geometry.attributes.color.array;
            for (let i = 0; i < arr.length; i += 3) {
                arr[i] = 1.0; arr[i+1] = 0.95; arr[i+2] = 0.4;
            }
            cloud.geometry.attributes.color.needsUpdate = true;
            cloud.material.opacity = 1.0;
            cloud.visible = true;
        } else if (mergeSelection.size > 0 && !gt) {
            // Dim non-selected unconfirmed when selection active
            cloud.material.opacity = 0.15;
            cloud.visible = true;
            // Restore original colors
            const orig = segmentOrigColors[seg.id];
            if (orig) {
                cloud.geometry.attributes.color.array.set(orig);
                cloud.geometry.attributes.color.needsUpdate = true;
            }
        } else {
            // Normal display
            const orig = segmentOrigColors[seg.id];
            if (orig) {
                cloud.geometry.attributes.color.array.set(orig);
                cloud.geometry.attributes.color.needsUpdate = true;
            }
            cloud.material.opacity = 1.0;
            cloud.visible = true;
        }
    }
}

// ── Sidebar List ──
function buildSidebarList() {
    const list = document.getElementById('segment-list');
    while (list.firstChild) list.removeChild(list.firstChild);

    const displayList = getDisplayList();

    if (mode === 'unconfirmed') {
        displayList.forEach(function(seg, i) {
            const item = document.createElement('div');
            item.className = 'item' + (i === navIndex ? ' active' : '');
            item.dataset.index = i;

            // Eye toggle
            const eye = document.createElement('span');
            eye.className = 'eye' + (isHidden(seg.id) ? ' hidden' : '');
            eye.textContent = isHidden(seg.id) ? '◻' : '👁';
            eye.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleHide(seg.id);
            });

            // Info
            const info = document.createElement('span');
            info.className = 'seg-info';
            const badge = document.createElement('span');
            const clbl = seg.class_label || null;
            if (clbl) {
                badge.className = 'class-badge class-' + clbl;
                badge.textContent = clbl;
            } else {
                badge.className = 'seg-type type-' + (seg.type || 'unknown');
                badge.textContent = (seg.type || '?').substring(0, 3);
            }
            info.appendChild(badge);
            info.appendChild(document.createTextNode('#' + seg.id));

            // Points
            const pts = document.createElement('span');
            pts.className = 'seg-pts';
            pts.textContent = seg.n_points.toLocaleString();

            item.appendChild(eye);
            item.appendChild(info);
            item.appendChild(pts);

            item.addEventListener('click', function() {
                navIndex = i;
                focusSegment(seg);
                addBBox(seg);
                buildSidebarList();
                updateNavCounter();
            });

            list.appendChild(item);
        });
    } else if (mode === 'all') {
        // All source segments, with confirmed status shown
        const srcToGt = {};
        for (const gt of session.confirmed) {
            for (const sid of gt.source_segment_ids) srcToGt[sid] = gt;
        }
        displayList.forEach(function(seg, i) {
            const item = document.createElement('div');
            item.className = 'item' + (i === navIndex ? ' active' : '');

            const eye = document.createElement('span');
            eye.className = 'eye' + (isHidden(seg.id) ? ' hidden' : '');
            eye.textContent = isHidden(seg.id) ? '◻' : '👁';
            eye.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleHide(seg.id);
            });

            const info = document.createElement('span');
            info.className = 'seg-info';
            const gt = srcToGt[seg.id];
            if (gt) {
                const badge = document.createElement('span');
                badge.className = 'class-badge class-' + gt.label;
                badge.textContent = gt.label;
                info.appendChild(badge);
            } else {
                const badge = document.createElement('span');
                badge.className = 'seg-type type-' + (seg.type || 'unknown');
                badge.textContent = (seg.type || '?').substring(0, 3);
                info.appendChild(badge);
            }
            info.appendChild(document.createTextNode('#' + seg.id));

            const pts = document.createElement('span');
            pts.className = 'seg-pts';
            pts.textContent = seg.n_points.toLocaleString();

            item.appendChild(eye);
            item.appendChild(info);
            item.appendChild(pts);

            item.addEventListener('click', function() {
                navIndex = i;
                focusSegment(seg);
                addBBox(seg);
                buildSidebarList();
                updateNavCounter();
            });

            list.appendChild(item);
        });
    } else {
        // Confirmed mode
        session.confirmed.forEach(function(gt, i) {
            const item = document.createElement('div');
            item.className = 'item' + (i === navIndex ? ' active' : '');

            const badge = document.createElement('span');
            badge.className = 'class-badge class-' + gt.label;
            badge.textContent = gt.label;

            const info = document.createElement('span');
            info.className = 'seg-info';
            info.appendChild(badge);
            info.appendChild(document.createTextNode('GT#' + gt.gt_id + ' (' + gt.source_segment_ids.length + ' segs)'));

            // Compute total points
            let totalPts = 0;
            for (const sid of gt.source_segment_ids) {
                const seg = allSegments.find(s => s.id === sid);
                if (seg) totalPts += seg.n_points;
            }
            const pts = document.createElement('span');
            pts.className = 'seg-pts';
            pts.textContent = totalPts.toLocaleString();

            const unbtn = document.createElement('span');
            unbtn.className = 'unmerge-btn';
            unbtn.textContent = '✕';
            unbtn.title = 'Unmerge';
            unbtn.addEventListener('click', function(e) {
                e.stopPropagation();
                unmergeGT(gt.gt_id);
            });

            item.appendChild(info);
            item.appendChild(pts);
            item.appendChild(unbtn);

            item.addEventListener('click', function() {
                navIndex = i;
                // Focus on combined bbox of all source segments
                focusGTSegment(gt);
                buildSidebarList();
                updateNavCounter();
            });

            list.appendChild(item);
        });
    }

    updateModeButtons();
    updateNavCounter();
    updateVisibilityCount();
}

function focusGTSegment(gt) {
    removeBBox();
    let minB = [Infinity, Infinity, Infinity];
    let maxB = [-Infinity, -Infinity, -Infinity];
    for (const sid of gt.source_segment_ids) {
        const seg = allSegments.find(s => s.id === sid);
        if (!seg) continue;
        for (let d = 0; d < 3; d++) {
            minB[d] = Math.min(minB[d], seg.bbox_min[d]);
            maxB[d] = Math.max(maxB[d], seg.bbox_max[d]);
        }
    }
    if (minB[0] === Infinity) return;
    const center = [(minB[0]+maxB[0])/2, (minB[1]+maxB[1])/2, (minB[2]+maxB[2])/2];
    const ext = Math.sqrt((maxB[0]-minB[0])**2 + (maxB[1]-minB[1])**2 + (maxB[2]-minB[2])**2);
    const fakeSeg = { center: center, extent: ext, bbox_min: minB, bbox_max: maxB };
    focusSegment(fakeSeg);
    addBBox(fakeSeg);
}

function updateModeButtons() {
    const nUnconf = getUnconfirmedSegments().length;
    const nConf = session.confirmed.length;
    document.getElementById('btn-unconfirmed').textContent = 'Unconfirmed (' + nUnconf + ')';
    document.getElementById('btn-confirmed').textContent = 'Confirmed (' + nConf + ')';
    document.getElementById('btn-all').textContent = 'All (' + allSegments.length + ')';
    document.getElementById('btn-unconfirmed').classList.toggle('active', mode === 'unconfirmed');
    document.getElementById('btn-confirmed').classList.toggle('active', mode === 'confirmed');
    document.getElementById('btn-all').classList.toggle('active', mode === 'all');
}

function updateNavCounter() {
    const dl = getDisplayList();
    if (navIndex >= 0 && navIndex < dl.length) {
        document.getElementById('nav-counter').textContent = (navIndex + 1) + '/' + dl.length;
    } else {
        document.getElementById('nav-counter').textContent = dl.length + ' total';
    }
}

// ── Mode ──
function setMode(m) {
    mode = m;
    navIndex = -1;
    mergeSelection.clear();
    removeBBox();
    updateSegmentVisuals();
    buildSidebarList();
    updateSelectionPanel();
}

// ── Label Filter ──
function setLabelFilter(f) {
    labelFilter = f;
    navIndex = -1;
    // Update filter button active states
    var filters = ['all', 'pipe', 'tank', 'equipment', 'structural', 'double'];
    for (var i = 0; i < filters.length; i++) {
        var btn = document.getElementById('flt-' + filters[i]);
        if (btn) btn.classList.toggle('active', filters[i] === f);
    }
    buildSidebarList();
    updateVisibilityCount();
}

function getFilteredSourceIds() {
    // Get source segment IDs for the current filtered display list
    var dl = getDisplayList();
    var ids = new Set();
    for (var i = 0; i < dl.length; i++) {
        var item = dl[i];
        if (item.source_segment_ids) {
            for (var j = 0; j < item.source_segment_ids.length; j++) {
                ids.add(item.source_segment_ids[j]);
            }
        } else {
            ids.add(item.id);
        }
    }
    return ids;
}

function showAllSegments() {
    var ids = getFilteredSourceIds();
    session.hidden_segments = session.hidden_segments.filter(function(sid) {
        return !ids.has(sid);
    });
    updateSegmentVisuals();
    buildSidebarList();
    updateVisibilityCount();
}

function hideAllSegments() {
    var ids = getFilteredSourceIds();
    ids.forEach(function(sid) {
        if (session.hidden_segments.indexOf(sid) < 0) {
            session.hidden_segments.push(sid);
        }
    });
    updateSegmentVisuals();
    buildSidebarList();
    updateVisibilityCount();
}

function showOnlyFiltered() {
    // Hide everything, then show only what's in the current filtered display list
    var dl = getDisplayList();
    var showIds = new Set();
    for (var i = 0; i < dl.length; i++) {
        var item = dl[i];
        if (item.source_segment_ids) {
            // Confirmed GT segment — show all its source segments
            for (var j = 0; j < item.source_segment_ids.length; j++) {
                showIds.add(item.source_segment_ids[j]);
            }
        } else {
            showIds.add(item.id);
        }
    }
    session.hidden_segments = [];
    for (var i = 0; i < allSegments.length; i++) {
        if (!showIds.has(allSegments[i].id)) {
            session.hidden_segments.push(allSegments[i].id);
        }
    }
    updateSegmentVisuals();
    buildSidebarList();
    updateVisibilityCount();
}

function updateVisibilityCount() {
    var nVisible = allSegments.length - session.hidden_segments.length;
    var el = document.getElementById('visibility-count');
    if (el) el.textContent = nVisible + '/' + allSegments.length + ' visible';
}

// ── Navigation ──
function stepNav(delta) {
    const dl = getDisplayList();
    if (dl.length === 0) return;
    if (navIndex < 0) {
        navIndex = delta > 0 ? 0 : dl.length - 1;
    } else {
        navIndex = ((navIndex + delta) % dl.length + dl.length) % dl.length;
    }

    if (mode === 'confirmed') {
        const gt = dl[navIndex];
        focusGTSegment(gt);
    } else {
        // 'unconfirmed' or 'all' — navigate source segments
        const seg = dl[navIndex];
        focusSegment(seg);
        addBBox(seg);
    }
    buildSidebarList();
    // Scroll active into view
    const activeEl = document.querySelector('#segment-list .item.active');
    if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
}

// ── Selection (Ctrl+Click) ──
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.05;
const mouse = new THREE.Vector2();

container.addEventListener('click', function(e) {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();

    // Only select unconfirmed segments
    if (mode !== 'unconfirmed') return;

    const rect = container.getBoundingClientRect();
    const localX = e.clientX - rect.left;

    // When split, only raycast on the left half (point cloud side)
    const pcW = showMesh ? Math.floor(rect.width / 2) : rect.width;
    if (localX > pcW) return;

    mouse.x = (localX / pcW) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    // Raycast against all visible unconfirmed segment clouds
    const unconf = getUnconfirmedSegments();
    const clouds = unconf.map(s => segmentClouds[s.id]).filter(c => c && c.visible);
    const hits = raycaster.intersectObjects(clouds);

    if (hits.length > 0) {
        const segId = hits[0].object.userData.segId;
        if (mergeSelection.has(segId)) {
            mergeSelection.delete(segId);
        } else {
            mergeSelection.add(segId);
        }
        updateSegmentVisuals();
        updateSelectionPanel();
    }
});

function updateSelectionPanel() {
    const panel = document.getElementById('selection-panel');
    const pills = document.getElementById('sel-pills');
    const stats = document.getElementById('sel-stats');

    if (mergeSelection.size === 0) {
        panel.style.display = 'none';
        return;
    }
    panel.style.display = 'block';

    // Clear pills
    while (pills.firstChild) pills.removeChild(pills.firstChild);

    let totalPts = 0;
    let bmin = [Infinity, Infinity, Infinity];
    let bmax = [-Infinity, -Infinity, -Infinity];

    for (const sid of mergeSelection) {
        const seg = allSegments.find(s => s.id === sid);
        if (!seg) continue;

        const pill = document.createElement('span');
        pill.className = 'pill';
        pill.textContent = '#' + sid + ' (' + seg.n_points + ')';
        pills.appendChild(pill);

        totalPts += seg.n_points;
        for (let d = 0; d < 3; d++) {
            bmin[d] = Math.min(bmin[d], seg.bbox_min[d]);
            bmax[d] = Math.max(bmax[d], seg.bbox_max[d]);
        }
    }

    const dims = [
        (bmax[0]-bmin[0]).toFixed(2),
        (bmax[1]-bmin[1]).toFixed(2),
        (bmax[2]-bmin[2]).toFixed(2),
    ];
    stats.textContent = totalPts.toLocaleString() + ' pts | ' +
        mergeSelection.size + ' segments | bbox: ' + dims.join('×') + 'm';
}

// ── Confirm (Ctrl+Enter) ──
let pendingConfirm = false;

function showLabelPicker() {
    if (mergeSelection.size === 0) return;
    document.getElementById('label-picker').style.display = 'block';
    pendingConfirm = true;
}

function hideLabelPicker() {
    document.getElementById('label-picker').style.display = 'none';
    pendingConfirm = false;
}

function confirmLabel(label) {
    hideLabelPicker();

    const srcIds = Array.from(mergeSelection);
    const gtId = session.next_gt_id++;
    const gtSeg = {
        gt_id: gtId,
        label: label,
        class_id: { pipe: 0, tank: 1, equipment: 2, structural: 3, double: 4 }[label],
        source_segment_ids: srcIds,
    };
    session.confirmed.push(gtSeg);

    // Recolor source segments to class color
    const rgb = CLASS_COLORS[label] || [0.6, 0.6, 0.6];
    for (const sid of srcIds) {
        const cloud = segmentClouds[sid];
        if (!cloud) continue;
        const arr = cloud.geometry.attributes.color.array;
        for (let i = 0; i < arr.length; i += 3) {
            arr[i] = rgb[0]; arr[i+1] = rgb[1]; arr[i+2] = rgb[2];
        }
        cloud.geometry.attributes.color.needsUpdate = true;
        cloud.material.opacity = 1.0;
        // Update stored original colors to class color
        segmentOrigColors[sid] = arr.slice();
    }

    // Auto-hide confirmed segments if toggle is on
    if (autoHideConfirmed) {
        for (const sid of srcIds) {
            if (session.hidden_segments.indexOf(sid) < 0) {
                session.hidden_segments.push(sid);
            }
            const cloud = segmentClouds[sid];
            if (cloud) cloud.visible = false;
        }
    }

    mergeSelection.clear();
    updateSegmentVisuals();
    buildSidebarList();
    updateSelectionPanel();
    scheduleSave();
}

// ── Unmerge ──
function unmergeGT(gtId) {
    const idx = session.confirmed.findIndex(g => g.gt_id === gtId);
    if (idx < 0) return;
    const gt = session.confirmed[idx];

    // Restore source segments to golden ratio colors
    for (const sid of gt.source_segment_ids) {
        const seg = allSegments.find(s => s.id === sid);
        const cloud = segmentClouds[sid];
        if (!seg || !cloud) continue;

        const rgb = hueToRgb((sid * GOLDEN_RATIO) % 1.0);
        const arr = cloud.geometry.attributes.color.array;
        for (let i = 0; i < arr.length; i += 3) {
            arr[i] = rgb[0]; arr[i+1] = rgb[1]; arr[i+2] = rgb[2];
        }
        cloud.geometry.attributes.color.needsUpdate = true;
        segmentOrigColors[sid] = arr.slice();
    }

    session.confirmed.splice(idx, 1);
    if (navIndex >= session.confirmed.length) navIndex = session.confirmed.length - 1;

    updateSegmentVisuals();
    buildSidebarList();
    scheduleSave();
}

// ── Hide/Show ──
function toggleHide(segId) {
    const idx = session.hidden_segments.indexOf(segId);
    if (idx >= 0) {
        session.hidden_segments.splice(idx, 1);
    } else {
        session.hidden_segments.push(segId);
    }
    const cloud = segmentClouds[segId];
    if (cloud) cloud.visible = !isHidden(segId);
    buildSidebarList();
    scheduleSave();
}

function toggleAutoHide() {
    autoHideConfirmed = document.getElementById('chk-autohide').checked;
    session.auto_hide_confirmed = autoHideConfirmed;
    scheduleSave();
}

function toggleContext() {
    showCtx = document.getElementById('chk-context').checked;
    if (contextCloud) contextCloud.visible = showCtx;
}

function toggleMesh() {
    showMesh = document.getElementById('chk-mesh').checked;
    if (showMesh && !meshRenderer) {
        // Create mesh renderer and scene
        meshRenderer = new THREE.WebGLRenderer({ antialias: true });
        meshRenderer.domElement.style.position = 'absolute';
        meshRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(meshRenderer.domElement);

        meshScene = new THREE.Scene();
        meshScene.background = new THREE.Color(0x0a0a1a);
        meshScene.add(new THREE.AmbientLight(0xffffff, 1.0));
    }
    if (showMesh && !meshObject) {
        // Lazy-load the GLB
        var loader = new THREE.GLTFLoader();
        loader.load('/mesh.glb', function(gltf) {
            gltf.scene.traverse(function(child) {
                if (child.isMesh && child.material) {
                    // Preserve scan texture colors with unlit material
                    var oldMat = child.material;
                    var newMat = new THREE.MeshBasicMaterial();
                    if (oldMat.map) newMat.map = oldMat.map;
                    if (oldMat.color) newMat.color.copy(oldMat.color);
                    if (oldMat.vertexColors) newMat.vertexColors = true;
                    child.material = newMat;
                }
            });
            meshObject = gltf.scene;
            meshScene.add(meshObject);
        });
    }
    resizeRenderer();
}

// ── Save / Export ──
function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(saveSession, 500);
}

function saveSession() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    session.mode = mode;
    fetch('/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(session),
    }).then(function() {
        const el = document.getElementById('save-indicator');
        el.textContent = 'Saved ' + new Date().toLocaleTimeString();
        setTimeout(function() { el.textContent = ''; }, 3000);
    });
}

function doExport() {
    if (session.confirmed.length === 0) {
        alert('No confirmed segments to export.');
        return;
    }
    // Save first, then export
    session.mode = mode;
    fetch('/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(session),
    }).then(function() {
        return fetch('/export', { method: 'POST' });
    }).then(function(r) { return r.json(); })
    .then(function(data) {
        if (data.ok) {
            const m = data.meta;
            alert('Exported ' + m.n_gt_segments + ' GT segments (' +
                m.n_labeled_points.toLocaleString() + ' labeled points)');
        }
    });
}

// ── Keyboard ──
document.addEventListener('keydown', function(e) {
    // Label picker shortcuts
    if (pendingConfirm) {
        if (e.key === '1') { confirmLabel('pipe'); return; }
        if (e.key === '2') { confirmLabel('tank'); return; }
        if (e.key === '3') { confirmLabel('equipment'); return; }
        if (e.key === '4') { confirmLabel('structural'); return; }
        if (e.key === '5') { confirmLabel('double'); return; }
        if (e.key === 'Escape') { hideLabelPicker(); return; }
        return;
    }

    if (e.key === 'ArrowRight') { e.preventDefault(); stepNav(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); stepNav(-1); }
    else if (e.key === 'Escape') {
        mergeSelection.clear();
        updateSegmentVisuals();
        updateSelectionPanel();
    }
    else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        showLabelPicker();
    }
    else if (e.key === 's' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        saveSession();
    }
});

// ── Apply session state on resume ──
function applySession() {
    if (session.mode) mode = session.mode;

    // Recolor confirmed segments
    const srcToGt = {};
    for (const gt of session.confirmed) {
        for (const sid of gt.source_segment_ids) srcToGt[sid] = gt;
    }

    for (const seg of allSegments) {
        const gt = srcToGt[seg.id];
        if (!gt) continue;
        const cloud = segmentClouds[seg.id];
        if (!cloud) continue;

        const rgb = CLASS_COLORS[gt.label] || [0.6, 0.6, 0.6];
        const arr = cloud.geometry.attributes.color.array;
        for (let i = 0; i < arr.length; i += 3) {
            arr[i] = rgb[0]; arr[i+1] = rgb[1]; arr[i+2] = rgb[2];
        }
        cloud.geometry.attributes.color.needsUpdate = true;
        segmentOrigColors[seg.id] = arr.slice();
    }

    // Apply hidden
    for (const sid of session.hidden_segments) {
        const cloud = segmentClouds[sid];
        if (cloud) cloud.visible = false;
    }
}

// ── Render Loop ──
function animate() {
    requestAnimationFrame(animate);
    updateCameraAnim();
    controls.update();
    renderer.render(scene, camera);
    if (meshRenderer && showMesh) meshRenderer.render(meshScene, camera);
}

// ── Init ──
fetch('/data')
    .then(function(r) { return r.json(); })
    .then(function(data) {
        allSegments = data.segments;
        contextData = data.context;
        sceneCenter = data.scene_center;
        sceneExtent = data.scene_extent;
        if (data.session) {
            session = data.session;
            // Ensure fields exist
            if (!session.confirmed) session.confirmed = [];
            if (!session.hidden_segments) session.hidden_segments = [];
            if (session.next_gt_id === undefined) session.next_gt_id = 0;
        }

        if (data.has_mesh) {
            hasMesh = true;
            document.getElementById('lbl-mesh').style.display = '';
        }

        resizeRenderer();
        controls.target.set(sceneCenter[0], sceneCenter[1], sceneCenter[2]);
        const dist = sceneExtent * 0.9;
        camera.position.set(
            sceneCenter[0] + dist * 0.6,
            sceneCenter[1] + dist * 0.4,
            sceneCenter[2] + dist * 0.6
        );

        buildContextCloud();
        buildScene();
        if (session.confirmed.length > 0) applySession();
        if (session.mode) mode = session.mode;
        if (session.auto_hide_confirmed) {
            autoHideConfirmed = true;
            document.getElementById('chk-autohide').checked = true;
        }
        buildSidebarList();

        document.getElementById('loading').classList.add('hidden');
        animate();
    });

</script>
